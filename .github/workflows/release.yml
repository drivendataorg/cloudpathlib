name: release
run-name: Release of ${{ inputs.version }}${{ inputs.dry-run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag'
        required: true
      dry-run:
        description: 'Dry run'
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  check-version:
    name: Check metadata version is correct
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that versions match
        run: |
          echo "Input version tag: [${INPUTS_VERSION}]"
          PACKAGE_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "Package version: [$PACKAGE_VERSION]"
          [[ ${INPUTS_VERSION} == "v$PACKAGE_VERSION" ]] || exit 1
        env:
          INPUTS_VERSION: ${{ inputs.version }}

  extract-changelog:
    name: Extract changelog content
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the changelog heading doesn't say "Unreleased"
        # ENVIRON rather than -v so the version is compared as a literal string, never as a regex.
        run: |
          awk '
            /^(```|~~~)/ { fence = !fence }
            !fence && /^## / && $2 == ENVIRON["INPUTS_VERSION"] { ok = tolower($0) !~ /unreleased/; exit }
            END { exit !ok }
          ' HISTORY.md
        env:
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Extract changelog section
        run: |
          awk '
            BEGIN { version = ENVIRON["INPUTS_VERSION"] }
            /^(```|~~~)/ { fence = !fence }
            !fence && /^## / { if (found) exit; if ($2 == version) { found = 1; next } }
            found
          ' HISTORY.md > __CHANGELOG-extracted.md
          cat __CHANGELOG-extracted.md
        env:
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Check the extracted section is not empty
        run: grep -q '[^[:space:]]' __CHANGELOG-extracted.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changelog-extracted
          path: __CHANGELOG-extracted.md

  build-and-inspect-package:
    name: Build and inspect package
    needs: [check-version, extract-changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Need both of these for attest-build-provenance-github
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2
        with:
          attest-build-provenance-github: ${{ !inputs.dry-run }}

  upload-to-test-pypi:
    name: Upload package to Test PyPI
    needs: build-and-inspect-package
    runs-on: ubuntu-latest
    environment: release  # Required for PyPI trusted publishing
    permissions:
      id-token: write  # Required for PyPI trusted publishing

    steps:
      - name: Download built artifact to dist/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  upload-to-prod-pypi:
    name: Upload package to Prod PyPI
    needs: upload-to-test-pypi
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment: release  # Required for PyPI trusted publishing
    permissions:
      id-token: write  # Required for PyPI trusted publishing

    steps:
      - name: Download built artifact to dist/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  create-github-release:
    name: Create GitHub release
    needs: [upload-to-test-pypi, upload-to-prod-pypi]
    if: ${{ !cancelled()
            && needs.upload-to-test-pypi.result == 'success'
            && (needs.upload-to-prod-pypi.result == 'success'
                || needs.upload-to-prod-pypi.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built artifact to dist/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist

      - name: Download extracted changelog
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changelog-extracted

      - name: Print diagnostics
        if: ${{ inputs.dry-run }}
        run: |
          echo "${INPUTS_VERSION}"
          echo "---"
          ls ./dist
          echo "---"
          echo "${GITHUB_SHA}"
          echo "---"
          cat __CHANGELOG-extracted.md
        env:
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Create release
        if: ${{ !inputs.dry-run }}
        run: |
          gh release create "${INPUTS_VERSION}" \
            --title "${INPUTS_VERSION}" \
            --target "${GITHUB_SHA}" \
            --notes-file __CHANGELOG-extracted.md \
            ./dist/*.whl \
            ./dist/*.tar.gz
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUTS_VERSION: ${{ inputs.version }}

  stage-docs:
    name: Stage docs on gh-pages
    needs: create-github-release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Push to the gh-pages branch

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build docs
        run: |
          make docs

      - name: Set git user to github-actions[bot]
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Fetch gh-pages branch
        run: |
          git fetch origin gh-pages --depth=1

      - name: Deploy as stable
        working-directory: docs
        run: |
          mike list -j | jq
          # Rename old stable version
          OLD_STABLE=$(mike list -j | jq -r '.[] | select(.aliases | index("stable")) | .title' | awk '{print $1;}')
          echo "${OLD_STABLE}"
          mike retitle stable "${OLD_STABLE}"
          # Deploy new version as stable
          mike deploy --update-aliases --alias-type=copy \
            "${INPUTS_VERSION%.*}" \
            stable \
            --title="${INPUTS_VERSION} (stable)"
        env:
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Push gh-pages branch
        if: ${{ !inputs.dry-run }}
        run: |
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          TOKEN: ${{ github.token }}

  deploy-docs:
    name: Deploy docs to Netlify
    needs: stage-docs
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      statuses: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          persist-credentials: false

      - name: Deploy docs to Netlify
        uses: nwtgck/actions-netlify@d22a32a27c918fe470bbc562e984f80ec48c2668 # v4.0.0
        with:
          publish-dir: "./"
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: false
          overwrites-pull-request-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 1
