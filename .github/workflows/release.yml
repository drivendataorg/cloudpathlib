name: release
run-name: Release of ${{ inputs.version }}${{ inputs.dry-run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag'
        required: true
      dry-run:
        description: 'Dry run'
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash  # Adds -o pipefail

jobs:
  check-version:
    name: Check version and tag
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-suffix: "release"

      - name: Check that versions match
        run: |
          echo "Input version tag: [${INPUTS_VERSION}]"
          PACKAGE_VERSION=$(uvx vspect read .)
          echo "Package version: [$PACKAGE_VERSION]"
          [[ ${INPUTS_VERSION} == "v$PACKAGE_VERSION" ]] || exit 1
        env:
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Check the tag doesn't exist
        run: |
          TAG_REF=$(git ls-remote --tags origin "refs/tags/${INPUTS_VERSION}")
          if [[ -n "${TAG_REF}" ]]; then
            echo "::error::Tag ${INPUTS_VERSION} already exists. If it isn't from a published release, delete it and rerun."
            exit 1
          fi
        env:
          INPUTS_VERSION: ${{ inputs.version }}

  extract-changelog:
    name: Extract changelog content
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the changelog heading doesn't say "Unreleased"
        # ENVIRON rather than -v so the version is compared as a literal string, never as a regex.
        run: |
          awk '
            /^(```|~~~)/ { fence = !fence }
            !fence && /^## / && $2 == ENVIRON["INPUTS_VERSION"] { ok = tolower($0) !~ /unreleased/; exit }
            END { exit !ok }
          ' HISTORY.md
        env:
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Extract changelog section
        run: |
          awk '
            BEGIN { version = ENVIRON["INPUTS_VERSION"] }
            /^(```|~~~)/ { fence = !fence }
            !fence && /^## / { if (found) exit; if ($2 == version) { found = 1; next } }
            found
          ' HISTORY.md > __CHANGELOG-extracted.md
          cat __CHANGELOG-extracted.md
        env:
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Check the extracted section is not empty
        run: grep -q '[^[:space:]]' __CHANGELOG-extracted.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changelog-extracted
          path: __CHANGELOG-extracted.md

  build-and-inspect-package:
    name: Build and inspect package
    needs: [check-version, extract-changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Need both of these for attest-build-provenance-github
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2
        with:
          attest-build-provenance-github: ${{ !inputs.dry-run }}

  create-draft-release:
    name: Create draft GitHub release${{ inputs.dry-run && ' (dry run)' || '' }}
    needs: build-and-inspect-package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built artifact to dist/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist

      - name: Download extracted changelog
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changelog-extracted

      - name: Check no draft release exists
        run: |
          DRAFT_URLS=$(gh api --paginate "repos/${GH_REPO}/releases" \
            --jq '.[] | select(.draft and .tag_name == env.INPUTS_VERSION) | .html_url')
          if [[ -n "${DRAFT_URLS}" ]]; then
            echo "::error::A draft release for ${INPUTS_VERSION} already exists. Delete it and rerun."
            echo "${DRAFT_URLS}"
            exit 1
          fi
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Print diagnostics
        if: ${{ inputs.dry-run }}
        run: |
          echo "${INPUTS_VERSION}"
          echo "---"
          ls ./dist
          echo "---"
          echo "${GITHUB_SHA}"
          echo "---"
          cat __CHANGELOG-extracted.md
        env:
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Create draft release
        if: ${{ !inputs.dry-run }}
        run: |
          gh release create "${INPUTS_VERSION}" \
            --draft \
            --title "${INPUTS_VERSION}" \
            --target "${GITHUB_SHA}" \
            --notes-file __CHANGELOG-extracted.md \
            ./dist/*.whl \
            ./dist/*.tar.gz
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          INPUTS_VERSION: ${{ inputs.version }}

  upload-to-test-pypi:
    name: Upload package to Test PyPI
    needs: create-draft-release
    runs-on: ubuntu-latest
    environment: testpypi  # Required for PyPI trusted publishing
    permissions:
      id-token: write  # Required for PyPI trusted publishing

    steps:
      - name: Download built artifact to dist/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  upload-to-prod-pypi:
    name: Upload package to Prod PyPI
    needs: upload-to-test-pypi
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment: pypi  # Required for PyPI trusted publishing
    permissions:
      id-token: write  # Required for PyPI trusted publishing

    steps:
      - name: Download built artifact to dist/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-github-release:
    name: Publish GitHub release
    needs: upload-to-prod-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built artifact to dist/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist

      - name: Check the draft release matches the built package
        id: check-draft
        run: |
          TAG_REF=$(git ls-remote --tags "https://github.com/${GH_REPO}.git" "refs/tags/${INPUTS_VERSION}")
          if [[ -n "${TAG_REF}" ]]; then
            echo "::error::Tag ${INPUTS_VERSION} already exists."
            exit 1
          fi

          DRAFTS=$(gh api --paginate "repos/${GH_REPO}/releases" \
            --jq '.[] | select(.draft and .tag_name == env.INPUTS_VERSION)' | jq --slurp .)
          if [[ $(jq length <<< "${DRAFTS}") != 1 ]]; then
            echo "::error::Expected one draft release for ${INPUTS_VERSION}, found $(jq length <<< "${DRAFTS}")."
            exit 1
          fi
          DRAFT_TARGET=$(jq -r '.[0].target_commitish' <<< "${DRAFTS}")
          if [[ "${DRAFT_TARGET}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Draft release targets ${DRAFT_TARGET}, not ${GITHUB_SHA}."
            exit 1
          fi

          EXPECTED_ASSETS=$(cd dist && for f in *.whl *.tar.gz; do echo "${f} sha256:$(sha256sum "${f}" | cut -d' ' -f1)"; done | sort)
          DRAFT_ASSETS=$(jq -r '.[0].assets[] | "\(.name) \(.digest)"' <<< "${DRAFTS}" | sort)
          if [[ "${DRAFT_ASSETS}" != "${EXPECTED_ASSETS}" ]]; then
            echo "::error::Draft release assets don't match the built package."
            diff <(echo "${EXPECTED_ASSETS}") <(echo "${DRAFT_ASSETS}") || true
            exit 1
          fi

          echo "release-id=$(jq -r '.[0].id' <<< "${DRAFTS}")" | tee -a "${GITHUB_OUTPUT}"
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Publish release
        run: |
          gh api --method PATCH "repos/${GH_REPO}/releases/${RELEASE_ID}" -F draft=false --jq .html_url
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.check-draft.outputs.release-id }}

  publish-docs:
    name: Publish stable docs
    needs: publish-github-release
    permissions:
      contents: write
      deployments: write
      statuses: write
    uses: $/.github/workflows/docs-publish.yml
    with:
      deploy-as: version
      is-stable: true
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
