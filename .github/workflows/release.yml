name: release
run-name: Release of ${{ inputs.version }}${{ inputs.dry-run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag'
        required: true
      dry-run:
        description: 'Dry run'
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  check-version:
    name: Check metadata version is correct
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-suffix: "release"

      - name: Check that versions match
        run: |
          echo "Input version tag: [${INPUTS_VERSION}]"
          PACKAGE_VERSION=$(uvx vspect read .)
          echo "Package version: [$PACKAGE_VERSION]"
          [[ ${INPUTS_VERSION} == "v$PACKAGE_VERSION" ]] || exit 1
        env:
          INPUTS_VERSION: ${{ inputs.version }}

  extract-changelog:
    name: Extract changelog content
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the changelog heading doesn't say "Unreleased"
        # ENVIRON rather than -v so the version is compared as a literal string, never as a regex.
        run: |
          awk '
            /^(```|~~~)/ { fence = !fence }
            !fence && /^## / && $2 == ENVIRON["INPUTS_VERSION"] { ok = tolower($0) !~ /unreleased/; exit }
            END { exit !ok }
          ' HISTORY.md
        env:
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Extract changelog section
        run: |
          awk '
            BEGIN { version = ENVIRON["INPUTS_VERSION"] }
            /^(```|~~~)/ { fence = !fence }
            !fence && /^## / { if (found) exit; if ($2 == version) { found = 1; next } }
            found
          ' HISTORY.md > __CHANGELOG-extracted.md
          cat __CHANGELOG-extracted.md
        env:
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Check the extracted section is not empty
        run: grep -q '[^[:space:]]' __CHANGELOG-extracted.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changelog-extracted
          path: __CHANGELOG-extracted.md

  build-and-inspect-package:
    name: Build and inspect package
    needs: [check-version, extract-changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Need both of these for attest-build-provenance-github
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2
        with:
          attest-build-provenance-github: ${{ !inputs.dry-run }}

  upload-to-test-pypi:
    name: Upload package to Test PyPI
    needs: build-and-inspect-package
    runs-on: ubuntu-latest
    environment: release  # Required for PyPI trusted publishing
    permissions:
      id-token: write  # Required for PyPI trusted publishing

    steps:
      - name: Download built artifact to dist/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  upload-to-prod-pypi:
    name: Upload package to Prod PyPI
    needs: upload-to-test-pypi
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment: release  # Required for PyPI trusted publishing
    permissions:
      id-token: write  # Required for PyPI trusted publishing

    steps:
      - name: Download built artifact to dist/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  create-github-release:
    name: Create GitHub release
    needs: [upload-to-test-pypi, upload-to-prod-pypi]
    if: ${{ !cancelled()
            && needs.upload-to-test-pypi.result == 'success'
            && (needs.upload-to-prod-pypi.result == 'success'
                || needs.upload-to-prod-pypi.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built artifact to dist/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist

      - name: Download extracted changelog
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changelog-extracted

      - name: Print diagnostics
        if: ${{ inputs.dry-run }}
        run: |
          echo "${INPUTS_VERSION}"
          echo "---"
          ls ./dist
          echo "---"
          echo "${GITHUB_SHA}"
          echo "---"
          cat __CHANGELOG-extracted.md
        env:
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Create release
        if: ${{ !inputs.dry-run }}
        run: |
          gh release create "${INPUTS_VERSION}" \
            --title "${INPUTS_VERSION}" \
            --target "${GITHUB_SHA}" \
            --notes-file __CHANGELOG-extracted.md \
            ./dist/*.whl \
            ./dist/*.tar.gz
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUTS_VERSION: ${{ inputs.version }}

