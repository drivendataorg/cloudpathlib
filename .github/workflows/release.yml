name: release
run-name: Release of ${{ inputs.version }}${{ inputs.dry-run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag'
        required: true
      dry-run:
        description: 'Dry run'
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash  # Adds -o pipefail

jobs:
  check-version:
    name: Check version and tag
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-suffix: "release"

      - name: Check that versions match
        run: |
          echo "Input version tag: [${INPUTS_VERSION}]"
          PACKAGE_VERSION=$(uvx vspect read .)
          echo "Package version: [$PACKAGE_VERSION]"
          [[ ${INPUTS_VERSION} == "v$PACKAGE_VERSION" ]] || exit 1
        env:
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Check the tag doesn't exist
        run: |
          TAG_REF=$(git ls-remote --tags origin "refs/tags/${INPUTS_VERSION}")
          if [[ -n "${TAG_REF}" ]]; then
            echo "::error::Tag ${INPUTS_VERSION} already exists. If it isn't from a published release, delete it and rerun."
            exit 1
          fi
        env:
          INPUTS_VERSION: ${{ inputs.version }}

  extract-changelog:
    name: Extract changelog content
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the changelog heading doesn't say "Unreleased"
        # ENVIRON rather than -v so the version is compared as a literal string, never as a regex.
        run: |
          awk '
            /^(```|~~~)/ { fence = !fence }
            !fence && /^## / && $2 == ENVIRON["INPUTS_VERSION"] { ok = tolower($0) !~ /unreleased/; exit }
            END { exit !ok }
          ' HISTORY.md
        env:
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Extract changelog section
        run: |
          awk '
            BEGIN { version = ENVIRON["INPUTS_VERSION"] }
            /^(```|~~~)/ { fence = !fence }
            !fence && /^## / { if (found) exit; if ($2 == version) { found = 1; next } }
            found
          ' HISTORY.md > __CHANGELOG-extracted.md
          cat __CHANGELOG-extracted.md
        env:
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Check the extracted section is not empty
        run: grep -q '[^[:space:]]' __CHANGELOG-extracted.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changelog-extracted
          path: __CHANGELOG-extracted.md

  build-and-inspect-package:
    name: Build and inspect package
    needs: [check-version, extract-changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Need both of these for attest-build-provenance-github
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2
        with:
          attest-build-provenance-github: ${{ !inputs.dry-run }}

  create-draft-release:
    name: Create draft GitHub release${{ inputs.dry-run && ' (dry run)' || '' }}
    needs: build-and-inspect-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.get-release-id.outputs.release-id }}

    steps:
      - name: Download built artifact to dist/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist

      - name: Download extracted changelog
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changelog-extracted

      - name: Check no draft release exists
        run: |
          DRAFT_URLS=$(gh api --paginate "repos/${GH_REPO}/releases" \
            --jq '.[] | select(.draft and .tag_name == env.INPUTS_VERSION) | .html_url')
          if [[ -n "${DRAFT_URLS}" ]]; then
            echo "::error::A draft release for ${INPUTS_VERSION} already exists. Delete it and rerun."
            echo "${DRAFT_URLS}"
            exit 1
          fi
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Print diagnostics
        if: ${{ inputs.dry-run }}
        run: |
          {
            echo "## Dry run of ${INPUTS_VERSION}"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo "### Files"
            echo
            echo '```'
            (cd dist && sha256sum -- *.whl *.tar.gz)
            echo '```'
            echo
            echo "### Release notes"
            echo
            cat __CHANGELOG-extracted.md
          } | tee -a "${GITHUB_STEP_SUMMARY}"
        env:
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Create draft release
        run: |
          gh release create "${INPUTS_VERSION}" \
            --draft \
            --title "${INPUTS_VERSION}" \
            --target "${GITHUB_SHA}" \
            --notes-file __CHANGELOG-extracted.md \
            ./dist/*.whl \
            ./dist/*.tar.gz
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Get draft release ID
        id: get-release-id
        # The releases list can take a few seconds to include a new draft.
        run: |
          for _ in {1..10}; do
            RELEASE_ID=$(gh api --paginate "repos/${GH_REPO}/releases" \
              --jq '.[] | select(.draft and .tag_name == env.INPUTS_VERSION) | .id')
            [[ -n "${RELEASE_ID}" ]] && break
            sleep 3
          done
          if [[ -z "${RELEASE_ID}" ]]; then
            echo "::error::Draft release for ${INPUTS_VERSION} not found after creating it."
            exit 1
          fi
          if [[ $(wc -l <<< "${RELEASE_ID}") != 1 ]]; then
            echo "::error::Found more than one draft release for ${INPUTS_VERSION}: ${RELEASE_ID//$'\n'/, }"
            exit 1
          fi
          echo "release-id=${RELEASE_ID}" | tee -a "${GITHUB_OUTPUT}"
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Delete draft release (dry run)
        if: ${{ always() && inputs.dry-run && steps.get-release-id.outputs.release-id != '' }}
        run: |
          gh api --method DELETE "repos/${GH_REPO}/releases/${RELEASE_ID}"
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.get-release-id.outputs.release-id }}

  upload-to-test-pypi:
    name: Upload package to Test PyPI
    needs: create-draft-release
    runs-on: ubuntu-latest
    environment: testpypi  # Required for PyPI trusted publishing
    permissions:
      id-token: write  # Required for PyPI trusted publishing

    steps:
      - name: Download built artifact to dist/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  upload-to-prod-pypi:
    name: Upload package to Prod PyPI
    needs: upload-to-test-pypi
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment: pypi  # Required for PyPI trusted publishing
    permissions:
      id-token: write  # Required for PyPI trusted publishing

    steps:
      - name: Download built artifact to dist/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-github-release:
    name: Publish GitHub release
    needs: [create-draft-release, upload-to-prod-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check the tag doesn't exist
        run: |
          TAG_REF=$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${INPUTS_VERSION}")
          if [[ -n "${TAG_REF}" ]]; then
            echo "::error::Tag ${INPUTS_VERSION} already exists."
            exit 1
          fi
        env:
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Publish release
        run: |
          gh api --method PATCH "repos/${GH_REPO}/releases/${RELEASE_ID}" -F draft=false --jq .html_url
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-draft-release.outputs.release-id }}

  publish-docs:
    name: Publish stable docs
    needs: publish-github-release
    permissions:
      contents: write
      deployments: write
      statuses: write
    uses: $/.github/workflows/docs-publish.yml
    with:
      deploy-as: version
      is-stable: true
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
