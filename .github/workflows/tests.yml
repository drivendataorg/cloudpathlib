name: tests

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Run every Sunday
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v6
        with:
          activate-environment: true
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv pip install -r requirements-dev.txt

      - name: Lint package
        run: |
          make lint

  tests:
    name: Mocked Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: code-quality
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [3.9, "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    env:
      UV_MANAGED_PYTHON: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true

      - name: Install dependencies (other Python versions)
        run: |
          uv pip install -r requirements-dev.txt

      - name: Run mocked tests
        run: |
          make test

      - name: Build distribution and test installation (other Python versions)
        shell: bash
        run: |
          make dist
          uv pip install cloudpathlib@$(find dist -name 'cloudpathlib*.whl') --no-deps --force-reinstall
          python -c "import cloudpathlib"
          uv pip install cloudpathlib@$(find dist -name 'cloudpathlib*.tar.gz') --no-deps --force-reinstall
          python -c "import cloudpathlib"

      - name: Upload coverage to codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: true

  extras-test:
    name: Test independent installs of clients
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extra: ["s3", "azure", "gs"]
        include:
          - prefix: "s3"
            extra: "s3"
          - prefix: "az"
            extra: "azure"
          - prefix: "gs"
            extra: "gs"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true

      - name: Build cloudpathlib
        run: |
          uv pip install build
          make dist  # build cloudpathlib wheel

      - name: Create empty venv
        run: |
          uv venv ${{ matrix.extra }}-env

      - name: Install cloudpathlib[${{ matrix.extra }}]
        run: |
          source ${{ matrix.extra }}-env/bin/activate
          uv pip install "cloudpathlib[${{ matrix.extra }}]@$(find dist -name 'cloudpathlib*.whl')"

      - name: Test ${{ matrix.extra }} usage
        run: |
          source ${{ matrix.extra }}-env/bin/activate
          python -c 'from cloudpathlib import CloudPath; CloudPath("${{ matrix.prefix }}://bucket/test")'
        env:
          # Path construction makes no network request. Azure only needs a parseable
          # connection string, so this independent-install check uses a dummy value.
          AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=https;AccountName=fake;AccountKey=ZmFrZQ==;EndpointSuffix=core.windows.net"

  notify:
    name: Notify failed build
    needs: [code-quality, tests, extras-test]
    if: failure() && github.event.pull_request == null
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: jayqi/failed-build-issue-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
