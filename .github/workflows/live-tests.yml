name: live-tests
run-name: "${{ github.event_name == 'pull_request_target' && format('Live tests for PR #{0} @ {1}', github.event.number, github.event.pull_request.head.sha) || 'Live tests' }}"

on:
  push:
    branches: [master]
  # runs the trusted workflow from master and pins the PR head SHA in the event payload;
  # the job below is gated by an environment so fork PRs cannot reach secrets unreviewed
  pull_request_target:
  schedule:
    # Run every Sunday
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-rigs:
    name: Enumerate live test rigs
    runs-on: ubuntu-latest
    outputs:
      rigs: ${{ steps.rigs.outputs.rigs }}

    steps:
      # default checkout is the base branch, so the matrix always comes from trusted code
      - uses: actions/checkout@v4

      # the rigs and their concurrency are defined in tests/rigs.py so that a local
      # `make test-live-cloud-rig RIG=<rig>` runs exactly what the matching job below runs
      - id: rigs
        run: echo "rigs=$(make live-rigs PYTHON=python3)" >> "$GITHUB_OUTPUT"

  live-tests:
    name: Live Tests (${{ matrix.rig }})
    needs: live-rigs
    runs-on: ubuntu-latest
    # fork PRs wait for a maintainer to approve the run; everything else runs automatically
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.fork && 'reviewed-live-cloud' || 'live-cloud-ci' }}
    env:
      IS_FORK: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.fork }}
    strategy:
      # one provider being down or throttling shouldn't hide the other providers' results
      fail-fast: false
      matrix:
        rig: ${{ fromJSON(needs.live-rigs.outputs.rigs) }}

    steps:
      - uses: actions/checkout@v4
        with:
          # the PR head SHA was fixed when this run was created, so an approval always
          # tests exactly the commit shown in the run name
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # Fork runs reach this step only after environment approval.
          allow-unsafe-pr-checkout: true

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
          # unreviewed code must not write to the cache shared with master
          enable-cache: ${{ env.IS_FORK != 'true' }}

      - name: Install dependencies
        run: |
          uv pip install -r requirements-dev.txt

      - name: Authenticate to Google Cloud
        if: matrix.rig == 'gs'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: matrix.rig == 'gs'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Run live tests
        run: |
          make test-live-cloud-rig RIG=${{ matrix.rig }}
        env:
          # each job only runs the rig it is named for, so it only gets that rig's secrets; the
          # other providers' variables arrive empty, which the test suite treats as unset
          LIVE_AZURE_CONTAINER: ${{ startsWith(matrix.rig, 'azure') && secrets.LIVE_AZURE_CONTAINER || '' }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ matrix.rig == 'azure' && secrets.AZURE_STORAGE_CONNECTION_STRING || '' }}
          AZURE_STORAGE_GEN2_CONNECTION_STRING: ${{ matrix.rig == 'azure_gen2' && secrets.AZURE_STORAGE_GEN2_CONNECTION_STRING || '' }}
          AZURE_CLIENT_ID: ${{ startsWith(matrix.rig, 'azure') && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_TENANT_ID: ${{ startsWith(matrix.rig, 'azure') && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ startsWith(matrix.rig, 'azure') && secrets.AZURE_CLIENT_SECRET || '' }}
          LIVE_GS_BUCKET: ${{ matrix.rig == 'gs' && secrets.LIVE_GS_BUCKET || '' }}
          LIVE_S3_BUCKET: ${{ matrix.rig == 's3' && secrets.LIVE_S3_BUCKET || '' }}
          AWS_ACCESS_KEY_ID: ${{ matrix.rig == 's3' && secrets.AWS_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ matrix.rig == 's3' && secrets.AWS_SECRET_ACCESS_KEY || '' }}
          CUSTOM_S3_BUCKET: ${{ matrix.rig == 'custom_s3' && secrets.CUSTOM_S3_BUCKET || '' }}
          CUSTOM_S3_KEY_ID: ${{ matrix.rig == 'custom_s3' && secrets.CUSTOM_S3_KEY_ID || '' }}
          CUSTOM_S3_SECRET_KEY: ${{ matrix.rig == 'custom_s3' && secrets.CUSTOM_S3_SECRET_KEY || '' }}
          CUSTOM_S3_ENDPOINT: ${{ matrix.rig == 'custom_s3' && secrets.CUSTOM_S3_ENDPOINT || '' }}

      - name: Upload coverage to codecov
        if: env.IS_FORK != 'true'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: ${{ github.event_name != 'schedule' }}

      - name: Upload test report log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportlog-live-${{ matrix.rig }}
          path: reportlog.jsonl
          if-no-files-found: warn

  live-cloud-tests:
    # single stable check name to require on master, whatever the rig matrix contains
    name: live-cloud-tests
    needs: live-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.live-tests.result }}" = success

  notify:
    name: Notify failed build
    needs: [live-rigs, live-tests]
    if: failure() && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: jayqi/failed-build-issue-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
