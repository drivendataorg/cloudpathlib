[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "cloudpathlib"
version = "0.24.0"
description = "pathlib-style classes for cloud storage services."
readme = "README.md"
authors = [{ name = "DrivenData", email = "info@drivendata.org" }]
license = { file = "LICENSE" }
keywords = [
  "pathlib",
  "cloud storage",
  "s3",
  "azure blob storage",
  "google cloud storage",
]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.9"
dependencies = [
  "typing-extensions>4 ; python_version < '3.11'",
]

[project.optional-dependencies]
azure = ["azure-storage-blob>=12", "azure-storage-file-datalake>=12"]
gs = ["google-cloud-storage"]
s3 = ["boto3>=1.34.0"]
all = ["cloudpathlib[azure]", "cloudpathlib[gs]", "cloudpathlib[s3]"]


[project.urls]
"Repository" = "https://github.com/drivendataorg/cloudpathlib"
"Documentation" = "https://cloudpathlib.drivendata.org/"
"Bug Tracker" = "https://github.com/drivendataorg/cloudpathlib/issues"
"Changelog" = "https://cloudpathlib.drivendata.org/stable/changelog/"


[tool.black]
line-length = 99
target-version = ['py39', 'py310', 'py311', 'py312', 'py313', 'py314']
include = '\.pyi?$|\.ipynb$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | \.ipynb_checkpoints
  | docs/docs/script
)/
'''

[tool.mypy]
allow_redefinition = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=cloudpathlib --cov-report=term --cov-report=html --cov-report=xml -n=auto --report-log reportlog.jsonl"
testpaths = ["tests"]

[tool.coverage.run]
source = ["cloudpathlib"]
omit = ["cloudpathlib/legacy/glob.py"]

[tool.pyright]
include = ["cloudpathlib"]
typeCheckingMode = "basic"
# The rules below are disabled only for type-checking cloudpathlib's own source.
# They are all internal concerns that do not affect the types we expose to consumers
# (downstream projects do not inherit this configuration). The diagnostics they
# silence come from dynamically-typed cloud SDKs (boto3, azure, google-cloud), optional
# dependencies that may be absent, version-dependent CPython `pathlib` internals, and
# the fact that `CloudPath` intentionally mirrors but does not subclass `pathlib.Path`.
reportAttributeAccessIssue = "none"  # boto3/azure/gcs dynamic attrs; pathlib private internals
reportArgumentType = "none"          # passing CloudPath where stdlib stubs expect str/Path
reportCallIssue = "none"             # shutil/pathlib overloads that don't know about CloudPath
reportGeneralTypeIssues = "none"     # ClassVar parameterized by the Client TypeVar
reportMissingImports = "none"        # optional deps (e.g. importlib_metadata backport)
reportOptionalMemberAccess = "none"  # Optional values returned by cloud SDK calls
reportInconsistentOverload = "none"  # CloudPath vs Path in copy/copytree overloads
